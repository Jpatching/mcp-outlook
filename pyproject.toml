[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-outlook"
version = "0.1.0"
description = "Microsoft 365 Outlook Mail and Calendar Model Context Protocol (MCP) server for Claude and AI assistants with local Windows MAPI bridge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Josh Patching", email = "patchingjoshua@gmail.com" }
]
keywords = ["mcp", "model-context-protocol", "outlook", "claude", "microsoft-365", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "mcp>=1.0.0",
    "msal>=1.28.0",
    "httpx>=0.27.0",
    "python-dateutil>=2.8.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
mcp-outlook = "server:cli_main"

[tool.setuptools]
py-modules = ["server", "local_outlook", "auth", "graph_client"]
